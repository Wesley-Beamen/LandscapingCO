<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";
import {
    getFirestore,
    collection,
    onSnapshot,
    deleteDoc,
    doc,
    query,
    orderBy
} from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCCmgHZXEX3-6RT7bqEfQytHbfpxD7GMTM",
  authDomain: "landscapingform.firebaseapp.com",
  projectId: "landscapingform",
  storageBucket: "landscapingform.firebasestorage.app",
  messagingSenderId: "233664675176",
  appId: "1:233664675176:web:493b8ce3153acc9dd1eadd"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let all = [];
let selectedDate = null;

/* ---------------- LOGIN ---------------- */
window.login = async function(){
    const email = document.getElementById("email").value;
    const pass = document.getElementById("password").value;

    await signInWithEmailAndPassword(auth,email,pass);
};

window.logout = function(){
    signOut(auth);
};

onAuthStateChanged(auth,user=>{
    if(user){
        document.getElementById("login").style.display="none";
        document.getElementById("dashboard").style.display="block";
        load();
    }else{
        document.getElementById("login").style.display="flex";
        document.getElementById("dashboard").style.display="none";
    }
});

/* ---------------- LOAD DATA ---------------- */
function load(){
    const q = query(collection(db,"appointments"),orderBy("submitted","asc"));

    onSnapshot(q,snap=>{
        all = [];

        snap.forEach(d=>{
            all.push({id:d.id,...d.data()});
        });

        renderCalendar();
        renderList();
    });
}

/* ---------------- GROUP BY DATE ---------------- */
function getCounts(){
    const counts = {};

    all.forEach(a=>{
        if(!counts[a.date]) counts[a.date] = 0;
        counts[a.date]++;
    });

    return counts;
}

/* ---------------- CALENDAR ---------------- */
window.renderCalendar = function(){

    const cal = document.getElementById("calendar");
    cal.innerHTML = "";

    const counts = getCounts();
    const now = new Date();

    for(let m=0;m<2;m++){

        const monthDate = new Date(now.getFullYear(), now.getMonth()+m, 1);

        const monthName = monthDate.toLocaleString('default',{month:'long'});
        const year = monthDate.getFullYear();
        const month = monthDate.getMonth();

        const days = new Date(year, month+1, 0).getDate();

        let html = `
        <div class="month-block">
        <div class="month-name">${monthName} ${year}</div>
        <div class="grid">`;

        for(let i=1;i<=days;i++){

            const dateStr =
                `${year}-${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;

            const count = counts[dateStr] || 0;

            html += `
            <div class="day ${selectedDate===dateStr?'selected':''}"
            onclick="selectDate('${dateStr}')"
            style="position:relative">

                ${i}

                ${count > 0 ? `
                <div style="
                    position:absolute;
                    top:2px;
                    right:2px;
                    background:red;
                    color:white;
                    border-radius:50%;
                    width:18px;
                    height:18px;
                    font-size:11px;
                    display:flex;
                    align-items:center;
                    justify-content:center;">
                    ${count}
                </div>` : ""}
            </div>`;
        }

        html += "</div></div>";

        cal.innerHTML += html;
    }
};

/* ---------------- LIST (ALL APPOINTMENTS) ---------------- */
window.renderList = function(){

    let data = [...all];

    document.getElementById("count").innerText = data.length;

    const list = document.getElementById("list");
    list.innerHTML = "";

    data.forEach(a=>{
        list.innerHTML += `
        <div class="card">
            <h3>${a.name}</h3>
            <p>${a.email}</p>
            <p>${a.address}</p>
            <p>${a.date} @ ${a.time}</p>

            <button class="delete" onclick="remove('${a.id}')">
                Delete (Completed)
            </button>
        </div>`;
    });
};

/* ---------------- DELETE ---------------- */
window.remove = async function(id){
    await deleteDoc(doc(db,"appointments",id));
};

/* ---------------- CALENDAR CLICK ---------------- */
window.selectDate = function(date){
    selectedDate = date;
    renderCalendar();
};

/* ---------------- CLEAR FILTER ---------------- */
window.clearFilter = function(){
    selectedDate = null;
    renderCalendar();
};

window.today = function(){
    selectedDate = new Date().toISOString().split("T")[0];
    renderCalendar();
};

</script>
