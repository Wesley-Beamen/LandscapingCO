<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#f4f6f3;
}

/* LOGIN */
#login{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.box{
    width:320px;
    padding:30px;
    background:white;
    border-radius:12px;
    box-shadow:0 5px 20px rgba(0,0,0,0.15);
}

input{
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:8px;
    border:1px solid #ccc;
}

button{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:none;
    border-radius:8px;
    background:#2e7d32;
    color:white;
    cursor:pointer;
}

/* DASHBOARD */
#dash{
    display:none;
}

header{
    background:#2e7d32;
    color:white;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    padding:15px;
    margin:10px 0;
    border-radius:10px;
}

.del{
    background:#c62828;
    margin-top:10px;
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
    <div class="box">
        <h2>Admin Login</h2>

        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">

        <button onclick="login()">Login</button>

        <p id="err" style="color:red;"></p>
    </div>
</div>

<!-- DASHBOARD -->
<div id="dash">

<header>
    <h2>Landscaping Admin</h2>
    <button onclick="logout()">Sign Out</button>
</header>

<div class="container">
    <h3>Total Requests: <span id="count">0</span></h3>
    <div id="list"></div>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";

import {
    getFirestore,
    collection,
    onSnapshot,
    deleteDoc,
    doc,
    query,
    orderBy
} from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCCmgHZXEX3-6RT7bqEfQytHbfpxD7GMTM",
  authDomain: "landscapingform.firebaseapp.com",
  projectId: "landscapingform",
  storageBucket: "landscapingform.firebasestorage.app",
  messagingSenderId: "233664675176",
  appId: "1:233664675176:web:493b8ce3153acc9dd1eadd"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

/* LOGIN */
window.login = async function(){

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try{
        await signInWithEmailAndPassword(auth, email, password);
    }catch(err){
        document.getElementById("err").innerText = "Login failed";
    }
};

/* LOGOUT */
window.logout = function(){
    signOut(auth);
};

/* AUTH STATE */
onAuthStateChanged(auth, user => {

    if(user){
        document.getElementById("login").style.display="none";
        document.getElementById("dash").style.display="block";
        loadData();
    } else {
        document.getElementById("login").style.display="flex";
        document.getElementById("dash").style.display="none";
    }
});

/* LOAD DATA */
function loadData(){

    const q = query(
        collection(db,"appointments"),
        orderBy("submitted","asc")
    );

    onSnapshot(q,(snap)=>{

        const list = document.getElementById("list");
        list.innerHTML = "";

        document.getElementById("count").innerText = snap.size;

        snap.forEach(d=>{

            const data = d.data();

            list.innerHTML += `
            <div class="card">
                <h3>${data.name}</h3>
                <p>${data.email}</p>
                <p>${data.address}</p>
                <p>${data.date} @ ${data.time}</p>

                <button class="del" onclick="remove('${d.id}')">
                    Delete (Completed)
                </button>
            </div>
            `;
        });

    });
}

window.remove = async function(id){
    await deleteDoc(doc(db,"appointments",id));
};

</script>

</body>
</html>
