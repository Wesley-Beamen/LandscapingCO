<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";
import {
    getFirestore,
    collection,
    addDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCCmgHZXEX3-6RT7bqEfQytHbfpxD7GMTM",
  authDomain: "landscapingform.firebaseapp.com",
  projectId: "landscapingform",
  storageBucket: "landscapingform.firebasestorage.app",
  messagingSenderId: "233664675176",
  appId: "1:233664675176:web:493b8ce3153acc9dd1eadd"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const form = document.getElementById("appointmentForm");

/* -------------------------
   EMAIL VALIDATION
-------------------------*/
function isValidEmail(email){
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

/* -------------------------
   DATE / TIME VALIDATION
-------------------------*/
function validateDateTime(dateStr, timeStr){

    const now = new Date();

    const date = new Date(dateStr + "T" + timeStr);

    // 1. Past check
    if(date < now){
        return "You cannot select a past date/time.";
    }

    // 2. 2 years future limit
    const maxFuture = new Date();
    maxFuture.setFullYear(maxFuture.getFullYear() + 2);

    if(date > maxFuture){
        return "You cannot book more than 2 years in advance.";
    }

    // 3. Time restrictions (6AM - 8PM)
    const hour = parseInt(timeStr.split(":")[0]);

    if(hour < 6 || hour >= 20){
        return "Appointments must be between 6:00 AM and 8:00 PM.";
    }

    return null;
}

/* -------------------------
   SUBMIT HANDLER
-------------------------*/
form.addEventListener("submit", async (e)=>{

    e.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const address = document.getElementById("address").value.trim();
    const date = document.getElementById("date").value;
    const time = document.getElementById("time").value;

    const status = document.getElementById("status");

    // EMAIL CHECK
    if(!isValidEmail(email)){
        status.innerText = "Invalid email format.";
        status.style.color = "red";
        return;
    }

    // DATE/TIME CHECK
    const error = validateDateTime(date, time);

    if(error){
        status.innerText = error;
        status.style.color = "red";
        return;
    }

    try{

        await addDoc(collection(db,"appointments"),{
            name,
            email,
            address,
            date,
            time,
            submitted: serverTimestamp()
        });

        status.innerText = "Appointment submitted successfully!";
        status.style.color = "green";

        form.reset();

    }catch(err){
        console.error(err);
        status.innerText = "Error submitting request.";
        status.style.color = "red";
    }

});

</script>
